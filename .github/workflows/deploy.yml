name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        run: pnpm run generate
        env:
          NODE_ENV: production
          NUXT_APP_BASE_URL: /

      - name: Deploy to Strato via SFTP
#        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        uses: AbleLincoln/push-to-sftp@v1.0
        with:
          username: ${{ secrets.STRATO_SFTP_USERNAME }}
          host: ${{ secrets.STRATO_SFTP_HOST }}
          port: ${{ secrets.STRATO_SFTP_PORT || 22 }}
          password: ${{ secrets.STRATO_SFTP_PASSWORD }}
          sourceDir: ./.output/public/
          targetDir: /wallbox
